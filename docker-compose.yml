version: '3.8'

services:
  # IPFS Kubo Storage Node
  ipfs-kubo:
    image: ipfs/kubo:latest
    container_name: depeft-ipfs
    restart: unless-stopped
    ports:
      - "127.0.0.1:4001:4001" # IPFS Swarm: expose via an authenticated gateway if needed
      - "127.0.0.1:5001:5001" # Kubo RPC must never be public
      - "127.0.0.1:8080:8080" # Gateway is local-only by default
    volumes:
      - ipfs_staging:/export
      - ipfs_data:/data/ipfs

  # Bootstrap DePEFT Node (Node 1)
  depeft-node-1:
    build: .
    container_name: depeft-bootstrap-node
    restart: unless-stopped
    ports:
      - "127.0.0.1:8545:8545" # Put mTLS reverse proxy in front of HTTP
      - "127.0.0.1:9000:9000" # Do not expose unauthenticated P2P publicly
    command: ["node", "start", "--port", "8545", "--p2p-port", "9000", "--testnet-tee-sim", "--enable-operator-endpoints", "--enable-faucet"]
    depends_on:
      - ipfs-kubo
    volumes:
      - node1_storage:/root/.depeft/storage

  # Peer Node (Node 2)
  depeft-node-2:
    build: .
    container_name: depeft-peer-node
    restart: unless-stopped
    ports:
      - "127.0.0.1:8546:8546"
      - "127.0.0.1:9001:9001"
    command: ["node", "start", "--port", "8546", "--p2p-port", "9001", "--bootnodes", "depeft-node-1:9000", "--testnet-tee-sim", "--enable-operator-endpoints", "--enable-faucet"]
    depends_on:
      - depeft-node-1
    volumes:
      - node2_storage:/root/.depeft/storage

volumes:
  ipfs_staging:
  ipfs_data:
  node1_storage:
  node2_storage:
