version: '3.8'

services:
  # IPFS Kubo Storage Node
  ipfs-kubo:
    image: ipfs/kubo:latest
    container_name: depeft-ipfs
    restart: unless-stopped
    ports:
      - "4001:4001"     # IPFS Swarm
      - "5001:5001"     # IPFS RPC API
      - "8080:8080"     # IPFS Gateway
    volumes:
      - ipfs_staging:/export
      - ipfs_data:/data/ipfs

  # Bootstrap DePEFT Node (Node 1)
  depeft-node-1:
    build: .
    container_name: depeft-bootstrap-node
    restart: unless-stopped
    ports:
      - "8545:8545"     # JSON-RPC HTTP
      - "9000:9000"     # P2P Gossip TCP
    command: ["node", "start", "--port", "8545", "--p2p-port", "9000"]
    depends_on:
      - ipfs-kubo
    volumes:
      - node1_storage:/root/.depeft/storage

  # Peer Node (Node 2)
  depeft-node-2:
    build: .
    container_name: depeft-peer-node
    restart: unless-stopped
    ports:
      - "8546:8546"     # JSON-RPC HTTP
      - "9001:9001"     # P2P Gossip TCP
    command: ["node", "start", "--port", "8546", "--p2p-port", "9001", "--bootnodes", "depeft-node-1:9000"]
    depends_on:
      - depeft-node-1
    volumes:
      - node2_storage:/root/.depeft/storage

volumes:
  ipfs_staging:
  ipfs_data:
  node1_storage:
  node2_storage:
