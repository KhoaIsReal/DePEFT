# Example production reverse proxy. Mount CA/server certificates outside git.
# The node remains loopback-bound; only clients with a certificate issued by
# `client_ca.crt` can reach operator endpoints when they are enabled.
server {
    listen 443 ssl;
    server_name depeft.example.invalid;

    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_client_certificate /etc/nginx/tls/client_ca.crt;
    ssl_verify_client on;

    location /api/v1/storage {
        proxy_pass http://127.0.0.1:8545;
    }
    location /api/v1/p2p/connect {
        proxy_pass http://127.0.0.1:8545;
    }
}
