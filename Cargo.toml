[package]
name = "depeft"
version = "0.1.0"
edition = "2024"
authors = ["DePEFT Contributors"]
description = "Decentralized Parameter-Efficient Fine-Tuning (PEFT) Network with ReLoRA Multi-Round Tournaments, TEE Attestation, and CometBFT Consensus"
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/khoadepeft/DePEFT"
homepage = "https://github.com/khoadepeft/DePEFT"
keywords = ["ai", "peft", "qlora", "blockchain", "candle"]
categories = ["cryptography::cryptocurrencies", "science"]

[lib]
name = "DePEFT"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rand = "0.8"
rand_distr = "0.4"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.38", features = ["full"] }
colored = "2.1"
hex = "0.4"
anyhow = "1.0"
thiserror = "1.0"
comfy-table = "7.1"
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
dirs = "5.0"
candle-core = "0.8"
candle-nn = "0.8"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
